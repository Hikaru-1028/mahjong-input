<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻雀 成績入力</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#d9dce1; --text:#1f2430; --sub:#667085; --ok:#18794e; --ng:#c0392b; --accent:#2b5fd9; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:16px; }
  main { max-width:560px; margin:0 auto; padding:12px 12px 150px; }
  h1 { font-size:20px; margin:8px 0 2px; }
  .season { color:var(--sub); font-size:13px; margin-bottom:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .card h2 { font-size:14px; margin:0 0 8px; color:var(--sub); font-weight:600; }
  .lbl { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--sub); margin:6px 0 2px; }
  .chk { display:flex; align-items:center; gap:4px; font-size:14px; color:var(--text); cursor:pointer; }
  .chk input { width:20px; height:20px; margin:0; }
  select, input[type=text], input[type=number] { width:100%; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); }
  .num { display:flex; align-items:center; border:1px solid var(--line); border-radius:8px; background:#fff; overflow:hidden; }
  .num input { border:0; border-radius:0; text-align:right; flex:1; min-width:0; }
  .num .zero { padding:0 12px 0 2px; font-size:16px; color:var(--text); font-variant-numeric:tabular-nums; }
  .hint { font-size:11px; color:var(--sub); }
  .rows { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px 10px; margin-bottom:10px; }
  .row { display:grid; grid-template-columns:2.4em auto minmax(0,1fr) 6.6em; grid-template-areas:"seat chk name num" ". . . hint"; column-gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .seat { grid-area:seat; font-size:13px; color:var(--sub); font-weight:600; }
  .row .chk { grid-area:chk; font-size:12px; color:var(--sub); }
  .row .chk input { width:16px; height:16px; }
  .row .name { grid-area:name; min-width:0; }
  .row .num { grid-area:num; }
  .row .hint { grid-area:hint; text-align:right; min-height:13px; }
  .row select, .row input[type=text], .row .num input { padding:7px 6px; font-size:15px; }
  .row .num .zero { font-size:15px; padding:0 6px 0 1px; }
  .kyorow { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub); padding:2px 0; }
  .kyorow .num { width:7em; }
  input[type=number] { -moz-appearance:textfield; appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .hidden { display:none; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .bar-inner { max-width:560px; margin:0 auto; }
  .sum { font-size:14px; margin-bottom:6px; display:flex; justify-content:space-between; gap:8px; }
  .sum.ok b { color:var(--ok); } .sum.ng b { color:var(--ng); }
  .msg { font-size:12px; color:var(--ng); min-height:16px; margin-bottom:6px; }
  button { width:100%; padding:14px; font-size:17px; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  button:disabled { background:#b8c0cc; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { text-align:right; padding:6px 4px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  .err { color:var(--ng); font-size:14px; }
  .plus { color:var(--ok); } .minus { color:var(--ng); }
</style>
</head>
<body>
<main>
  <h1>麻雀 成績入力</h1>
  <div class="season" id="season">読み込み中…</div>
  <div id="form" class="hidden">
    <div id="seats" class="rows"></div>
    <div class="card kyorow">
      <span>供託 (余った場合のみ)</span>
      <div class="num"><input id="kyo" type="number" step="1" min="0" inputmode="numeric" placeholder="10"><span class="zero">00</span></div>
    </div>
  </div>
  <div id="result" class="card hidden"></div>
</main>
<div class="bar" id="bar">
  <div class="bar-inner">
    <div class="sum" id="sum"><span>合計</span><b>-</b></div>
    <div class="msg" id="msg"></div>
    <button id="submit" disabled>送信</button>
  </div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbx5YdAM2orXTVJZ5n58xbFInvWxplmvCDrkvh4MN08JXew6x536XyC_XfSvV0nWO4QL/exec';
var init = null;
var NEW = '#新規';

function $(id) { return document.getElementById(id); }
function norm(s) { return String(s).normalize('NFKC').trim().toLowerCase(); }
function yen(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function unwrap(res) {
  return res.json().then(function (j) { if (!j.ok) throw new Error(j.error); return j.data; });
}

function load() {
  $('season').textContent = '読み込み中…';
  fetch(API + '?action=init').then(unwrap).then(onInit).catch(fatal);
}

function fatal(e) { $('season').innerHTML = ''; var d = document.createElement('div'); d.className = 'err'; d.textContent = '読み込みに失敗しました: ' + (e && e.message || e); $('season').appendChild(d); }

function onInit(d) {
  init = d;
  $('result').classList.add('hidden');
  $('bar').classList.remove('hidden');
  if (!d.season) {
    $('season').textContent = '現在のシーズンが登録されていません。スプレッドシートの「シーズン管理」を確認してください。';
    $('form').classList.add('hidden');
    $('submit').disabled = true;
    return;
  }
  $('season').textContent = 'シーズン: ' + d.season.name + ' ／ ' + d.season.mochi + '点持ち ' + d.season.kaeshi + '点返し';
  build();
  $('form').classList.remove('hidden');
  recompute();
}

function build() {
  var box = $('seats');
  box.innerHTML = '';
  $('kyo').value = '';
  init.seats.forEach(function (seat, k) {
    var row = document.createElement('div');
    row.className = 'row';
    var st = document.createElement('div'); st.className = 'seat'; st.textContent = seat; row.appendChild(st);

    // 新規チェック + 名前 (選択 or 自由入力)
    var cl = document.createElement('label'); cl.className = 'chk';
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'isnew' + k;
    var ct = document.createElement('span'); ct.textContent = '新規';
    cl.appendChild(cb); cl.appendChild(ct); row.appendChild(cl);

    var sel = document.createElement('select'); sel.id = 'sel' + k;
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = '名前'; sel.appendChild(o0);
    init.players.forEach(function (n) { var o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); });
    var nn = document.createElement('input'); nn.id = 'new' + k; nn.type = 'text'; nn.placeholder = '新規の名前'; nn.className = 'hidden';
    nn.autocomplete = 'off';
    var nm = document.createElement('div'); nm.className = 'name'; nm.appendChild(sel); nm.appendChild(nn); row.appendChild(nm);

    // 打点: 入力欄の後ろに固定の「00」
    var wrap = document.createElement('div'); wrap.className = 'num';
    var sc = document.createElement('input'); sc.id = 'sc' + k; sc.type = 'number'; sc.step = '1'; sc.inputMode = 'numeric'; sc.placeholder = '320';
    var zero = document.createElement('span'); zero.className = 'zero'; zero.textContent = '00';
    wrap.appendChild(sc); wrap.appendChild(zero); row.appendChild(wrap);
    var hint = document.createElement('div'); hint.className = 'hint'; hint.id = 'hint' + k; row.appendChild(hint);

    cb.addEventListener('change', function () {
      sel.classList.toggle('hidden', cb.checked);
      nn.classList.toggle('hidden', !cb.checked);
      if (cb.checked) nn.focus();
      recompute();
    });
    sel.addEventListener('change', recompute);
    nn.addEventListener('input', recompute);
    sc.addEventListener('input', recompute);
    box.appendChild(row);
  });
  $('kyo').oninput = recompute;
}

function readInt(id) {
  var v = $(id).value.trim();
  if (v === '') return { empty: true };
  if (!/^-?\d+$/.test(v)) return { bad: true };
  return { val: parseInt(v, 10) * 100 };
}

function gather() {
  var players = [];
  for (var k = 0; k < 4; k++) {
    var isNew = $('isnew' + k).checked;
    var r = readInt('sc' + k);
    players.push({
      sel: isNew ? NEW : $('sel' + k).value,
      newName: $('new' + k).value,
      score: r.val === undefined ? '' : String(r.val)
    });
  }
  var kr = readInt('kyo');
  return { players: players, kyotaku: kr.val === undefined ? '' : String(kr.val) };
}

function recompute() {
  if (!init || !init.season) return;
  var T = init.season.mochi * 4;
  var problems = [];
  var sum = 0, scoreOk = true;

  for (var k = 0; k < 4; k++) {
    var r = readInt('sc' + k);
    var hint = $('hint' + k);
    if (r.empty) { scoreOk = false; hint.textContent = ''; }
    else if (r.bad) { scoreOk = false; hint.textContent = ''; problems.push(init.seats[k] + 'の打点は整数で入力'); }
    else { sum += r.val; hint.textContent = '= ' + yen(r.val) + '点'; }
  }
  var kyo = 0, kyoBad = false;
  var kr = readInt('kyo');
  if (kr.bad || (kr.val !== undefined && kr.val < 0)) { kyoBad = true; problems.push('供託は0以上の整数で入力'); }
  else if (kr.val !== undefined) kyo = kr.val;
  var total = sum + kyo;

  var sumOk = scoreOk && !kyoBad && total === T;
  var el = $('sum');
  el.className = 'sum ' + (sumOk ? 'ok' : 'ng');
  el.innerHTML = '';
  var left = document.createElement('span');
  left.textContent = '合計 ' + yen(total) + ' / 必要 ' + yen(T) + (kyo ? '（供託 ' + yen(kyo) + ' 含む）' : '');
  var right = document.createElement('b');
  var diff = total - T;
  right.textContent = sumOk ? 'OK' : (scoreOk ? ((diff > 0 ? '+' : '') + yen(diff)) : '未入力あり');
  el.appendChild(left); el.appendChild(right);

  var seen = {};
  var namesOk = true;
  for (var j = 0; j < 4; j++) {
    var isNew = $('isnew' + j).checked;
    var nm = isNew ? $('new' + j).value.trim() : $('sel' + j).value;
    if (!nm) { namesOk = false; continue; }
    var key = norm(nm);
    if (seen[key]) { problems.push('同じ人が重複: ' + nm); namesOk = false; }
    seen[key] = true;
  }
  if (!namesOk && problems.length === 0) problems.push('全員の名前を入力してください');
  if (scoreOk && !kyoBad && !sumOk) problems.push('合計が持ち点×4（' + yen(T) + '）と一致しません');

  $('msg').textContent = problems.join(' / ');
  $('submit').disabled = !(sumOk && namesOk && problems.length === 0);
}

$('submit').addEventListener('click', function () {
  var btn = $('submit');
  btn.disabled = true; btn.textContent = '送信中…';
  fetch(API, { method: 'POST', body: JSON.stringify(gather()) }).then(unwrap)
    .then(function (r) { btn.textContent = '送信'; showResult(r); })
    .catch(function (e) { btn.textContent = '送信'; $('msg').textContent = '送信失敗: ' + (e && e.message || e); recompute(); });
});

function showResult(r) {
  $('form').classList.add('hidden');
  $('bar').classList.add('hidden');
  var box = $('result');
  box.innerHTML = '';
  box.classList.remove('hidden');
  var h = document.createElement('h2'); h.textContent = '登録しました (' + r.season + ')'; box.appendChild(h);
  var t = document.createElement('table');
  var hd = document.createElement('tr');
  ['席', '名前', '素点', '順位', 'pt'].forEach(function (x) { var th = document.createElement('th'); th.textContent = x; hd.appendChild(th); });
  t.appendChild(hd);
  r.rows.forEach(function (row) {
    var tr = document.createElement('tr');
    [row.seat, row.name, yen(row.score), row.rank + '位', (row.pt > 0 ? '+' : '') + row.pt.toFixed(1)].forEach(function (x, i) {
      var td = document.createElement('td'); td.textContent = x;
      if (i === 4) td.className = row.pt >= 0 ? 'plus' : 'minus';
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  box.appendChild(t);
  var again = document.createElement('button');
  again.textContent = '続けて入力する'; again.style.marginTop = '12px';
  again.addEventListener('click', function () { $('bar').classList.remove('hidden'); load(); });
  box.appendChild(again);
}

load();
</script>
</body>
</html>
